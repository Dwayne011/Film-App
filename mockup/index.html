<title>Film Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen app. Frosted Material panels float over a studio-light backdrop; an oversized wheel is the hero and runs off the sides of the screen. */
:root{
  color-scheme:dark;
  --bg:#0a0e2c; --bg-2:#1b1460;
  --glow-a:#3d5afe; --glow-b:#c51bff; --glow-c:#ffb300;
  --glass:rgba(255,255,255,.09); --glass-strong:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.22);
  --sheet:rgba(24,26,66,.78);
  --fg:#f4f5ff; --fg-dim:rgba(244,245,255,.68); --fg-faint:rgba(244,245,255,.4);
  --gold:#ffc940; --primary:#93a4ff; --on-gold:#2a1c00; --danger:#ff7a8a; --blood:#ff1f3d;
  --seen-a:#353a55; --seen-b:#40465f; --rim:#0d0f2e;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --gut:16px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.4;
  overflow:hidden; -webkit-tap-highlight-color:transparent;
}
body::after{ /* studio lights behind the glass */
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(60vmax 50vmax at 12% 8%, color-mix(in srgb,var(--glow-a) 60%,transparent), transparent 62%),
    radial-gradient(55vmax 45vmax at 95% 30%, color-mix(in srgb,var(--glow-b) 46%,transparent), transparent 60%),
    radial-gradient(50vmax 40vmax at 40% 105%, color-mix(in srgb,var(--glow-c) 34%,transparent), transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg-2));
}
.beams{ /* sweeping spotlights, only while the wheel spins */
  position:fixed; left:50%; top:42%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; z-index:-1; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.085) 0 7deg, transparent 7deg 30deg);
  opacity:0; transition:opacity .8s; animation:rot 14s linear infinite; animation-play-state:paused;
}
body.spinning .beams{opacity:1; animation-play-state:running}
@keyframes rot{to{transform:rotate(360deg)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glass{
  background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--r);
  -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.18);
}
.app{
  height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:12px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.chrome{transition:opacity .5s}
body.spinning .chrome{opacity:0;pointer-events:none}
/* App bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px}
.bar h1{font-size:20px;font-weight:900;letter-spacing:.2px;margin:0;line-height:1.1}
.bar .sub{font-size:12.5px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass)}
.icon-btn svg{width:22px;height:22px;fill:currentColor}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--glass-strong);color:var(--gold)}
/* Views */
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.tonight{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold)}
.tonight .t{font-size:16px;font-weight:700;overflow-wrap:anywhere}
/* Wheel: wider than the screen so each slice is bigger; sides run off the edges */
.stage{flex:1;min-height:0;position:relative;container-type:size;overflow:hidden;margin-inline:calc(var(--gut) * -1)}
.wheelbox{position:absolute;left:50%;top:14px;translate:-50% 0;width:min(145cqw,122cqh);aspect-ratio:1}
.rim{position:absolute;inset:0;border-radius:50%;background:var(--rim);
  box-shadow:0 0 0 2px var(--glass-line),0 0 70px color-mix(in srgb,var(--glow-a) 75%,transparent),0 18px 50px rgba(0,0,0,.5)}
#wheel{position:absolute;inset:3.4%;width:93.2%;height:93.2%;border-radius:50%;will-change:transform;touch-action:none;cursor:grab}
#lights{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flash{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.0) 30%,color-mix(in srgb,var(--gold) 80%,transparent) 68%,rgba(255,255,255,.9) 72%,transparent 74%)}
.pointer{position:absolute;left:50%;top:-8px;width:34px;height:46px;margin-left:-17px;z-index:3;transform-origin:50% 12%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));pointer-events:none}
.pointer svg{width:100%;height:100%;display:block}
.hub{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0;
  background:var(--glass-strong);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.hub .num{font-size:clamp(30px,11.5cqw,56px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hub .cap{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--fg-dim)}
.hub.seen .num{color:var(--fg-faint)}
.info{position:absolute;left:var(--gut);right:var(--gut);bottom:6px;z-index:4;min-height:52px;padding:8px 16px;border-radius:18px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--sheet)}
.info .ti{font-weight:700;overflow-wrap:anywhere}
.info .hint{color:var(--fg-dim);font-size:13.5px;grid-column:1/-1;text-align:center}
.yr{font-size:12.5px;color:var(--fg-dim);font-weight:400}
.meta{font-size:12px;color:var(--fg-faint);text-align:right}
/* Buttons */
.btn{min-height:52px;padding:0 22px;border-radius:99px;font-weight:700;font-size:15px;letter-spacing:.6px;text-transform:uppercase;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:linear-gradient(180deg,#ffd866,var(--gold));color:var(--on-gold);box-shadow:0 8px 24px color-mix(in srgb,var(--gold) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.tonal{background:var(--glass-strong);border:1px solid var(--glass-line)}
.btn.text{min-height:44px;padding:0 14px;color:var(--primary);text-transform:none;letter-spacing:.2px;font-weight:500}
.btn.text.danger{color:var(--danger)}
.btn.small{min-height:40px;padding:0 16px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn.block{width:100%}
.btn svg{width:20px;height:20px;fill:currentColor}
/* Bottom nav */
.nav{display:grid;grid-template-columns:1fr 1fr;padding:6px}
.nav button{min-height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--fg-dim)}
.nav button svg{width:24px;height:24px;fill:currentColor}
.nav button[aria-selected="true"]{background:var(--glass-strong);color:var(--fg)}
/* Film rows */
.listwrap{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.filters{display:flex;gap:8px;padding:12px 12px 8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--glass-line);font-size:13px;font-weight:500;color:var(--fg-dim)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.rows{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 6px 8px;margin:0;list-style:none}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;
  min-height:56px;padding:8px 10px;border-radius:14px}
.row .n{font-weight:900;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
.row .ti{font-weight:500;overflow-wrap:anywhere}
.row.seen .n,.row.seen .ti,.row.seen .yr{color:var(--fg-faint)}
.row.now{background:var(--glass-strong)}
button.row:active{background:var(--glass)}
/* Stars */
.stars{display:inline-flex;gap:1px;line-height:1;white-space:nowrap}
.stars .s{position:relative;display:inline-block;color:rgba(255,255,255,.2)}
.stars .s i{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold);font-style:normal}
.row .stars,.info .stars{font-size:15px}
/* Reveal overlay */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  background:rgba(3,3,12,.9);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dread{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 90px 30px var(--blood)}
.overlay .inner{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rv-head{padding:16px 0 8px;text-align:center}
.rv-head .big{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.rv-scroll{flex:1;min-height:0;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.rv-scroll.done{overflow-y:auto}
.rv-scroll ul{list-style:none;margin:0;padding:45vh 0}
.rv-scroll .row{transition:opacity .6s,background .6s,box-shadow .6s}
.rv-scroll .row > span:nth-child(2),.rv-scroll .row > :nth-child(3){transition:filter .9s,opacity .9s}
.rv-scroll .row.veil > span:nth-child(2){filter:blur(9px);opacity:.75}
.rv-scroll .row.veil > :nth-child(3){opacity:0}
.rv-scroll.done .row{opacity:.14}
.rv-scroll.done .row.cand{opacity:.8}
.rv-scroll.done .row.landed{opacity:1}
.rv-scroll.done .row.landed:not(.veil){background:var(--glass-strong);box-shadow:inset 0 0 0 2px var(--gold),0 0 40px color-mix(in srgb,var(--gold) 45%,transparent)}
.rv-pick{padding:14px;margin:8px 0 12px;display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;
  min-height:56px;padding:8px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-line)}
.opt .k{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fg-dim)}
.opt .ti{font-weight:700;overflow-wrap:anywhere}
.opt.main{background:linear-gradient(180deg,#ffd866,var(--gold));color:var(--on-gold);border-color:transparent}
.opt.main .k,.opt.main .yr{color:rgba(42,28,0,.7)}
.opt[disabled]{opacity:.5;cursor:default}
.opt .go{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
/* Sheet / dialog */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(4,5,18,.6);display:flex;align-items:flex-end;justify-content:center;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet{width:100%;max-width:488px;max-height:100%;overflow-y:auto;padding:22px 18px 16px;display:flex;flex-direction:column;gap:14px;text-align:center;background:var(--sheet);border-radius:28px}
.sheet h2{margin:0;font-size:22px;font-weight:900;text-wrap:balance;overflow-wrap:anywhere}
.sheet p{margin:0;color:var(--fg-dim)}
.sheet p.syn{color:var(--fg);font-size:15.5px;line-height:1.5;text-align:left;text-wrap:pretty}
.sheet .actions{display:flex;flex-direction:column;gap:6px}
.rate{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.rate .stars{font-size:clamp(40px,13vw,54px);touch-action:none;cursor:pointer;gap:2px;border-radius:12px;padding:2px 6px}
.rate .val{font-size:14px;font-weight:700;color:var(--fg-dim);font-variant-numeric:tabular-nums;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  padding:10px 16px;border-radius:99px;font-weight:500;font-size:13.5px;background:var(--sheet);width:max-content;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.rv-scroll .row,.rv-scroll .row > *{transition:none}.beams{animation:none}}
</style>

<div class="beams" aria-hidden="true"></div>
<div class="app">
  <header class="bar glass chrome">
    <div class="grow">
      <h1>Film Wheel</h1>
      <div class="sub" id="stats"></div>
    </div>
    <span class="badge">Mockup</span>
    <button class="icon-btn" id="mute" aria-label="Mute sound" aria-pressed="false"></button>
  </header>

  <section class="view" id="view-wheel">
    <div class="tonight glass chrome" id="tonight" hidden>
      <div class="grow">
        <div class="eyebrow">Tonight's film</div>
        <div class="t" id="tonight-title"></div>
      </div>
      <button class="btn primary small" id="tonight-rate">Rate it</button>
    </div>
    <div class="stage">
      <div class="wheelbox" id="wheelbox">
        <div class="rim"></div>
        <canvas id="wheel" aria-label="Wheel of 100 films. Hold and drag to browse."></canvas>
        <canvas id="lights" aria-hidden="true"></canvas>
        <div class="flash" id="flash"></div>
        <div class="pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 34 46"><path d="M17 45 L2 10 A15 15 0 0 1 32 10 Z" fill="#ffc940" stroke="#fff3c4" stroke-width="1.5"/><circle cx="17" cy="13" r="4.5" fill="#2a1c00"/></svg></div>
        <button class="hub" id="hub" aria-label="Spin the wheel">
          <span class="num" id="hub-num">100</span>
          <span class="cap" id="hub-cap">films</span>
        </button>
      </div>
      <button class="info glass chrome" id="info"></button>
    </div>
    <button class="btn primary block chrome" id="spin">Spin the wheel</button>
  </section>

  <section class="view" id="view-list" hidden>
    <div class="listwrap glass">
      <div class="filters" role="group" aria-label="Filter films">
        <button class="chip" data-f="all" aria-pressed="true">All 100</button>

        <button class="chip" data-f="seen" aria-pressed="false">Watched</button>

  <nav class="nav glass chrome" role="tablist">

    <button role="tab" id="tab-list" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5zm4 0h14v2H7V5zM3 11h2v2H3v-2zm4 0h14v2H7v-2zm-4 6h2v2H3v-2zm4 0h14v2H7v-2z"/></svg>The 100</button>
  </nav>
</div>

<div class="overlay" id="reveal" hidden>
  <div class="dread" id="dread"></div>
  <div class="inner">
    <div class="rv-head">
      <div class="eyebrow" id="rv-eyebrow"></div>
      <div class="big" id="rv-big"></div>
    </div>
    <div class="rv-scroll" id="rv-scroll"><ul id="rv-rows"></ul></div>
    <div class="rv-pick glass" id="rv-pick" hidden></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet glass" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast glass" id="toast" hidden></div>

const ease = p => 1 - Math.pow(1-p, 3);

async function spin(){

  const want = 360 - (target + .25 + Math.random()*.5)*SEG;

}

  const el = $("info");
  if (browseN == null){ el.innerHTML = '<span class="hint">Hold and drag the wheel to browse the films</span>'; el.disabled = true; return; }
  const n = browseN; el.disabled = false;
  el.innerHTML = '<span><span class="eyebrow">Number '+n+'</span><br><span class="ti">'+esc(title(n))+'</span> <span class="yr">'+year(n)+'</span></span>'+(statusHTML(n) || '<span class="meta">Not watched yet</span>');
}
$("info").onclick = () => { if (browseN != null) filmSheet(browseN); };
(() => {
  let prev = null;
  const at = e => { const r = cv.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; };
  const sync = () => {
    cv.style.transform = "rotate("+angle+"deg)";
    const n = indexAt(angle)+1;
    if (n !== browseN){ browseN = n; tick(.15); flap(.2); setHub(n, isSeen(n) ? "seen" : "to watch"); showInfo(); }
  };
  cv.addEventListener("pointerdown", e => { if (spinning) return; audio(); cv.setPointerCapture(e.pointerId); prev = at(e); cv.style.cursor = "grabbing"; sync(); });
  cv.addEventListener("pointermove", e => { if (prev == null || spinning) return; const a = at(e); let d = a-prev; if (d>180) d-=360; if (d<-180) d+=360; angle += d; prev = a; sync(); });
  const end = () => { prev = null; cv.style.cursor = ""; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
})();

/* ---------- reveal ---------- */
let menace = null, revealRun = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
function reveal(n){
  const run = ++revealRun, ov = $("reveal"), sc = $("rv-scroll"), ul = $("rv-rows"), pick = $("rv-pick"), dread = $("dread");
  const say = (a,b) => { $("rv-eyebrow").textContent = a; $("rv-big").textContent = b; };
  say("The wheel has spoken", "Number " + n);
  ul.innerHTML = FILMS.map((_,i) => rowHTML(i+1,"li")).join("");
  const cands = [n-1,n,n+1].filter(k => k>=1 && k<=100);
  cands.forEach(k => ul.children[k-1].classList.add("veil"));   // hidden until the very end
  sc.classList.remove("done"); pick.hidden = true; ov.hidden = false; sc.scrollTop = 0;
  const row = ul.children[n-1], end = row.offsetTop - sc.clientHeight/2 + row.offsetHeight/2;
  const quick = reduceMotion(), dur = quick ? 600 : (5200 + n*90), t0 = performance.now();
  menace = startMenace(); const m = menace;
  let tension = 0, looping = true;
  const pulse = () => { if (!quick) dread.animate([{opacity:.15+tension*.55},{opacity:0}],{duration:520,easing:"ease-out"}); };
  const loop = now => {
    if (run !== revealRun || !looping) return;
    const p = Math.min(1, (now-t0)/dur);
    if (p < 1){ sc.scrollTop = end*(1-Math.pow(1-p,3)); tension = p*.8; }
    if (m.beat(tension)) pulse();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  (async () => {
    await wait(dur); if (run !== revealRun) return;
    sc.scrollTop = end; sc.classList.add("done"); ul.children[n-1].classList.add("landed");
    cands.forEach(k => { if (k!==n) ul.children[k-1].classList.add("cand"); });
    if (!quick){
      tension = .88; await wait(1100); if (run !== revealRun) return;
      if (n > 1){ say("One above", "Number " + (n-1)); ul.children[n-2].classList.remove("veil"); tension = .93; await wait(1700); if (run !== revealRun) return; }
      if (n < 100){ say("One below", "Number " + (n+1)); ul.children[n].classList.remove("veil"); tension = 1; await wait(1900); if (run !== revealRun) return; }
      say("And the wheel chose", "Number " + n);
      looping = false; m.stop(.12);            // everything drops to silence…
      await wait(1500); if (run !== revealRun) return;
    } else { looping = false; m.stop(.2); cands.forEach(k => ul.children[k-1].classList.remove("veil")); }
    ul.children[n-1].classList.remove("veil");  // …then the film
    if (menace === m) menace = null;
    await wait(quick ? 0 : 1500); if (run !== revealRun) return;
    showPick(n);
  })();
}
function showPick(n){
  const pick = $("rv-pick");
  const opt = (k, label, main) => {
    if (k<1 || k>100) return "";
    const seen = isSeen(k), r = rating(k);
    return '<button class="opt'+(main?" main":"")+'" data-n="'+k+'"'+(seen?" disabled":"")+'><span><span class="k">'+label+' · #'+k+'</span><br><span class="ti">'+esc(title(k))+'</span> <span class="yr">'+year(k)+'</span></span>'+
      (seen ? (r?stars(r):'<span class="go">Seen</span>') : '<span class="go">Details</span>')+'</button>';
  };
  pick.innerHTML = '<div class="eyebrow" style="text-align:center">Which one tonight?</div>' + opt(n-1,"One above") + opt(n,"Landed on",true) + opt(n+1,"One below") +
    '<button class="btn text" id="rv-again">Spin again instead</button>';
  pick.hidden = false;
  const sc = $("rv-scroll"), row = $("rv-rows").children[n-1];
  sc.scrollTop = row.offsetTop - sc.clientHeight/2 + row.offsetHeight/2;
  pick.querySelectorAll(".opt").forEach(b => b.onclick = () => decideSheet(+b.dataset.n));
  $("rv-again").onclick = closeReveal;
}
function closeReveal(){ revealRun++; if (menace){ menace.stop(.15); menace=null; } $("reveal").hidden = true; }

/* ---------- sheets ---------- */
function openSheet(html){ $("sheet").innerHTML = html; $("scrim").hidden = false; $("sheet").scrollTop = 0; }
function closeSheet(){ $("scrim").hidden = true; }
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
function seenSheet(n){
  const r = rating(n);
  openSheet('<div class="eyebrow">Number '+n+' · already seen</div><h2>'+esc(title(n))+'</h2><p>'+(r ? stars(r)+' &nbsp;'+r+' / 5' : 'Watched, not rated yet')+'</p>'+
    '<div class="actions"><button class="btn primary block" id="sh-again">Spin again</button><button class="btn text" id="sh-close">Not now</button></div>');
  $("sh-again").onclick = () => { closeSheet(); spin(); }; $("sh-close").onclick = closeSheet;
}
// After the reveal: read about the film, watch the trailer, then decide.
function decideSheet(n){
  openSheet('<div class="eyebrow">Number '+n+' · '+year(n)+'</div><h2>'+esc(title(n))+'</h2>'+aboutHTML(n)+
    '<div class="actions"><button class="btn primary block" id="sh-yes">We\'re watching it</button><button class="btn text" id="sh-no">Not this one</button></div>');
  $("sh-yes").onclick = () => { S.current = n; save(); closeSheet(); closeReveal(); render(); toast("Tonight: " + title(n)); };
  $("sh-no").onclick = closeSheet;
}
// From the wheel or the list: about the film, plus rating.
function filmSheet(n){
  const seen = isSeen(n); let val = rating(n) || 0;
  openSheet('<div class="eyebrow">Number '+n+' · '+year(n)+'</div><h2>'+esc(title(n))+'</h2>'+aboutHTML(n)+
    '<div class="rate"><div id="rate-stars" role="slider" tabindex="0" aria-label="Your rating" aria-valuemin="0" aria-valuemax="5"></div><div class="val" id="rate-val"></div></div>'+
    '<div class="actions"><button class="btn primary block" id="sh-save">Save rating</button>'+
    (seen ? '<button class="btn text danger" id="sh-unwatch">Mark as not watched</button>' : '<button class="btn text" id="sh-later">We\'ve seen it — rate later</button>')+
    '<button class="btn text" id="sh-close">Close</button></div>');
  const box = $("rate-stars");
  const paint = () => { box.innerHTML = stars(val); box.setAttribute("aria-valuenow", val); $("rate-val").textContent = val ? val+" / 5" : "Tap or slide to rate — half stars allowed"; $("sh-save").disabled = !val; };
  const fromX = x => { const el = box.firstElementChild.getBoundingClientRect(); val = Math.max(.5, Math.min(5, Math.ceil((x-el.left)/el.width*10)/2)); paint(); };
  let down = false;
  box.addEventListener("pointerdown", e => { down = true; box.setPointerCapture(e.pointerId); fromX(e.clientX); });
  box.addEventListener("pointermove", e => { if (down) fromX(e.clientX); });
  box.addEventListener("pointerup", () => down = false); box.addEventListener("pointercancel", () => down = false);
  box.addEventListener("keydown", e => { if (e.key==="ArrowRight"||e.key==="ArrowUp"){ val=Math.min(5,val+.5); paint(); e.preventDefault(); } if (e.key==="ArrowLeft"||e.key==="ArrowDown"){ val=Math.max(.5,val-.5); paint(); e.preventDefault(); } });
  paint();
  const done = msg => { if (S.current===n && isSeen(n)) S.current=null; save(); closeSheet(); render(); toast(msg); };
  $("sh-save").onclick = () => { S.seen[n] = val; done(title(n)+" rated "+val+" / 5"); };
  $("sh-close").onclick = closeSheet;
  if (seen) $("sh-unwatch").onclick = () => { delete S.seen[n]; done(title(n)+" is back on the wheel"); };
  else $("sh-later").onclick = () => { S.seen[n] = null; done(title(n)+" marked as seen"); };
}
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- list + chrome ---------- */
let filter = "all";
function render(){
  const ns = Object.keys(S.seen), rated = ns.map(n => S.seen[n]).filter(r => r);
  const avg = rated.length ? (rated.reduce((a,b)=>a+b,0)/rated.length).toFixed(1) : "–";
  $("stats").textContent = ns.length+" of 100 watched · average "+avg+" ★";
  $("tonight").hidden = !S.current;
  if (S.current) $("tonight-title").textContent = "#"+S.current+" "+title(S.current)+" ("+year(S.current)+")";
  $("rows").innerHTML = FILMS.map((_,i)=>i+1).filter(n => filter==="all" || (filter==="seen") === isSeen(n))
    .map(n => "<li>"+rowHTML(n,"button")+"</li>").join("");
  drawWheel(); drawLights("idle", idlePhase); showInfo();
  if (!spinning){ if (browseN != null) setHub(browseN, isSeen(browseN) ? "seen" : "to watch"); else setHub(100-ns.length, "left to watch"); }
}
$("rows").addEventListener("click", e => { const b = e.target.closest(".row"); if (b) filmSheet(+b.dataset.n); });
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { filter = c.dataset.f; document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x===c)); render(); });
$("tonight-rate").onclick = () => filmSheet(S.current);
function tab(name){
  $("view-wheel").hidden = name!=="wheel"; $("view-list").hidden = name!=="list";
  $("tab-wheel").setAttribute("aria-selected", name==="wheel"); $("tab-list").setAttribute("aria-selected", name==="list");
  if (name==="wheel"){ drawWheel(); drawLights("idle", idlePhase); }
}
$("tab-wheel").onclick = () => tab("wheel"); $("tab-list").onclick = () => tab("list");
window.addEventListener("resize", () => { drawWheel(); drawLights("idle", idlePhase); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel);
setMute(false); render();
})();
</script>
